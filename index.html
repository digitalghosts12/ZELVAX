<script type="module">

const CATS=["Araba","Korku","Mafya","Oyun","Film","Müzik","Haber","Eğitim","Alışveriş","Sosyal","Teknoloji","Spor","Sanat","Diğer"];

let user=null,myName=null,nameP=Promise.resolve(),all=[],activeCat="Hepsi",editing=null,afterName=null;
let isAdmin=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const keyOf=s=>s.trim().toLocaleLowerCase("tr").replace(/\s+/g,"-");

const validKey=k=>/^[a-z0-9ğüşöçı_-]{2,40}$/.test(k);

const nameKey=s=>s.trim().toLowerCase();

const validName=k=>/^[a-z0-9ğüşöçı][a-z0-9ğüşöçı_.-]{2,19}$/.test(k);

const base=()=>location.origin+location.pathname;

const linkOf=k=>base()+"#"+encodeURIComponent(k);

/* İÇERİK ANALİZİ */

function extractContent(code){

try{

const parser=new DOMParser();
const parsed=parser.parseFromString(code||"","text/html");

parsed.querySelectorAll("script,style,noscript,svg,iframe,template").forEach(el=>el.remove());

const parts=[];

if(parsed.title) parts.push(parsed.title);

const meta=parsed.querySelector('meta[name="description"]');
if(meta) parts.push(meta.content);

parsed.querySelectorAll("h1,h2,h3,h4,h5,h6,p,button,label,a,li,option,th,td").forEach(el=>{
parts.push(el.textContent||"");
});

parsed.querySelectorAll("input,textarea").forEach(el=>{
parts.push(el.getAttribute("placeholder")||"");
parts.push(el.getAttribute("aria-label")||"");
});

parts.push(parsed.body?.innerText||parsed.body?.textContent||"");

return parts.join(" ").replace(/\s+/g," ").slice(0,30000);

}catch(e){

return String(code||"").replace(/<[^>]*>/g," ").slice(0,30000);

}

}


/* TÜRKÇE KELİME NORMALİZASYONU */

const stopWords=new Set([
"ve","veya","ile","bir","bu","şu","o","da","de","mi","mı","mu","mü",
"için","nasıl","ne","hangi","olan","olarak","ben","sen","biz","siz",
"istiyorum","istiyor","eder","etmek","yapmak","bana","bunu","şey",
"çok","daha","en","var","yok","gibi","ki","ama","fakat","ise"
]);

function normalizeWord(word){

return word
.toLocaleLowerCase("tr")
.replace(/[^a-z0-9ğüşöçı]/g,"")
.trim();

}

function stemWord(word){

let w=normalizeWord(word);

const suffixes=[
"larından","lerinden","larımızdan","lerimizden",
"larının","lerinin","larımız","lerimiz",
"lardan","lerden","ların","lerin",
"ları","leri","lardan","lerden",
"dan","den","tan","ten",
"dır","dir","dur","dür",
"lık","lik","luk","lük",
"lar","ler","ları","leri",
"ım","im","um","üm",
"ın","in","un","ün",
"da","de","ta","te",
"ı","i","u","ü","a","e"
];

for(const suffix of suffixes){

if(w.length>suffix.length+3 && w.endsWith(suffix)){
w=w.slice(0,-suffix.length);
break;
}

}

return w;

}

function tokenize(text){

return String(text||"")
.toLocaleLowerCase("tr")
.match(/[a-z0-9ğüşöçı]+/gi)
?.map(stemWord)
.filter(w=>w.length>1&&!stopWords.has(w))||[];

}


/* ANLAM BENZERLİĞİ */

const synonymGroups=[

["dil","lisan","yabancı dil"],
["ingilizce","english"],
["öğren","öğret","eğitim","ders","kurs","çalış"],
["seviye","düzey","kademe","derece"],
["ölç","test","sınav","sına","değerlendir","tespit","kontrol"],
["bilgi","bilgi düzeyi","bilgi seviyesi"],
["tamir","onarım","tadilat","arıza giderme","onar"],
["televizyon","tv","ekran"],
["bozul","arızalan","çalışmıyor","açılmıyor"],
["bilgisayar","pc","laptop","notebook"],
["telefon","cep telefonu","mobil"],
["oyun","game","eğlence"],
["müzik","şarkı","melodi","ses"],
["film","sinema","dizi"],
["alışveriş","satın al","ürün","mağaza"],
["haber","gündem","son dakika"],
["araba","otomobil","araç"],
["yemek","tarif","pişir","mutfak"],
["spor","antrenman","egzersiz","fitness"],
["güvenlik","koruma","siber güvenlik","hacker"],
["web","site","internet","sayfa"],
["fotoğraf","resim","görsel","image"],
["video","klip","kayıt"],
["para","kazanç","gelir","ücret"],
["hava","hava durumu","meteoroloji"],
["çocuk","bebek","çocuklar"],
["sağlık","doktor","hastalık","tedavi"]

];

const synonymMap=new Map();

for(const group of synonymGroups){

const words=group.flatMap(x=>tokenize(x));

for(const word of words){

if(!synonymMap.has(word)) synonymMap.set(word,new Set());

words.forEach(other=>synonymMap.get(word).add(other));

}

}

function expandTokens(tokens){

const result=new Set(tokens);

for(const token of tokens){

const group=synonymMap.get(token);

if(group) group.forEach(w=>result.add(w));

}

return [...result];

}


/* ARAMA İNDEKSİ */

function getSiteContent(site){

const htmlText=extractContent(site.code);

const title=site.name||"";
const category=site.category||"";
const description=site.description||"";
const keywords=Array.isArray(site.keywords)?site.keywords.join(" "):"";

const complete=[
title,
category,
description,
keywords,
htmlText
].join(" ");

return {

text:complete,

tokens:tokenize(complete),

expanded:expandTokens(tokenize(complete))

};

}


/* ARAMA PUANLAMASI */

function searchScore(site,query){

const qTokens=tokenize(query);

if(!qTokens.length) return 0;

const index=getSiteContent(site);

const queryExpanded=expandTokens(qTokens);

const titleTokens=tokenize(site.name||"");
const categoryTokens=tokenize(site.category||"");

let score=0;
let matched=0;

for(const token of qTokens){

let found=false;

if(titleTokens.includes(token)){
score+=12;
found=true;
}

if(categoryTokens.includes(token)){
score+=6;
found=true;
}

if(index.tokens.includes(token)){
score+=5;
found=true;
}

if(!found){

const related=synonymMap.get(token);

if(related){

for(const relatedWord of related){

if(index.tokens.includes(relatedWord)){
score+=3;
found=true;
break;
}

}

}

}

if(found) matched++;

}

for(const token of queryExpanded){

if(!qTokens.includes(token)&&index.expanded.includes(token)){
score+=0.7;
}

}

const coverage=matched/qTokens.length;

score*=0.5+coverage;

return score;

}

function smartSearch(query,list){

if(!query.trim()) return list;

return list
.map(site=>({
site,
score:searchScore(site,query)
}))
.filter(item=>item.score>0)
.sort((a,b)=>b.score-a.score)
.map(item=>({
...item.site,
_matchScore:item.score
}));

}

$("xbtn").classList.add("show");

$("xbtn").classList.remove("show");

drawChips();

function render(){

let list=all.filter(s=>
activeCat==="Hepsi"||s.category===activeCat

if(raw){

?list.map(s=>`

<div class="card" data-k="${esc(s.key)}">

<div class="n">${esc(s.name)}</div>

<div class="l">${esc(linkOf(s.key))}</div>

<div class="m">
<span>👤 ${esc(s.ownerName||"Anonim")}</span>
<span>${esc(s.category||"Diğer")}</span>
</div>

${raw?`<div class="match">İçerik eşleşmesi bulundu</div>`:""}

</div>

`).join("")
:`<div class="empty">İlgili site bulunamadı.</div>`;

$("grid").querySelectorAll(".card").forEach(el=>{

el.onclick=()=>location.hash=el.dataset.k;

});

}


/* FIREBASE SİTELERİNİ YÜKLE */

async function load(){

try{

const snap=await getDocs(
query(collection(db,"sites"),orderBy("createdAt","desc"),limit(300))
);

all=snap.docs.map(d=>({
key:d.id,
...d.data()
}));

render();

}catch(e){

$("grid").innerHTML=
`<div class="empty">Siteler yüklenemedi: ${esc(e.message)}</div>`;

}

}


/* ARAMA */

$("searchForm").onsubmit=async e=>{

e.preventDefault();

const v=$("q").value.trim();

if(!v) return render();

if(v.includes("#")){

location.hash=v.split("#")[1];
return;

}

render();

const k=keyOf(v);

if(validKey(k)&&!all.some(s=>s.key===k)){

const d=await getDoc(doc(db,"sites",k)).catch(()=>null);

if(d&&d.exists()){

all.unshift({
key:d.id,
...d.data()
});

render();

}

}

};

$("q").oninput=render;


/* KULLANICI GİRİŞİ */

async function loadMyName(){

try{

const d=await getDoc(doc(db,"users",user.uid));

myName=d.exists()?d.data().name:null;

}catch(e){

myName=null;

}

}

onAuthStateChanged(auth,async u=>{

const changed=!user||!u||user.uid!==u.uid;

user=u;

if(changed){

myName=null;
setAdminMode(false);

nameP=u?loadMyName():Promise.resolve();

}

});


async function needLogin(){

if(!user){

try{

const r=await signInWithPopup(auth,new GoogleAuthProvider());

user=r.user;
myName=null;
nameP=loadMyName();

}catch(e){

alert("Devam etmek için giriş gerekli: "+e.message);

return false;

}

}

await nameP;

return true;

}

$("nSave").onclick=async()=>{

const raw=$("nName").value.trim();
const key=nameKey(raw);

const err=m=>$("nErr").textContent=m;

if(!validName(key))
return err("Kullanıcı adı 3-20 karakter olmalı.");

if(!user)
return err("Önce giriş yapmalısın.");

const oldKey=myName?nameKey(myName):null;

if(myName&&raw===myName){
closeModal("mName");
return;
}

$("nSave").disabled=true;
err("");

try{

const ex=await getDoc(doc(db,"usernames",key));

if(ex.exists()&&ex.data().uid!==user.uid){

err("Bu kullanıcı adı zaten alınmış.");
$("nSave").disabled=false;
return;

}

const b=writeBatch(db);

if(ex.exists())
b.update(doc(db,"usernames",key),{name:raw});
else
b.set(doc(db,"usernames",key),{uid:user.uid,name:raw});

if(oldKey&&oldKey!==key)
b.delete(doc(db,"usernames",oldKey));

b.set(doc(db,"users",user.uid),{name:raw,key});

const mine=await getDocs(
query(collection(db,"sites"),where("owner","==",user.uid))
);

mine.docs.slice(0,480).forEach(d=>
b.update(d.ref,{ownerName:raw})
);

await b.commit();

myName=raw;

const cb=afterName;
afterName=null;

closeModal("mName");

await load();

if(cb) cb();

}catch(e){

err(e.message);

}

$("nSave").disabled=false;

};


/* SİTE OLUŞTUR / DÜZENLE */

function openEdit(site){

editing=site||null;

$("eTitle").textContent=site?"Site Ayarları":"Site Oluştur";

$("eName").value=site?site.name:"";

$("eCat").value=site?site.category||CATS[0]:CATS[0];

$("eCode").value=site?site.code:"";

$("eDel").style.display=site?"":"none";

$("eErr").textContent="";

updLink();

openModal("mEdit");

}

function updLink(){

const k=keyOf($("eName").value);

$("eLink").textContent=k?"Bağlantı: "+linkOf(k):"";

}

$("eName").oninput=updLink;

$("btnCreate").onclick=async()=>{

if(!(await needLogin())) return;

if(!myName){

openNameModal(()=>openEdit(null));

return;

}

openEdit(null);

};


/* SİTE KAYDET */

$("eSave").onclick=async()=>{

const name=$("eName").value.trim();

const key=keyOf(name);

const code=$("eCode").value;

const category=$("eCat").value;

const err=m=>$("eErr").textContent=m;

if(!validKey(key))
return err("Ad 2-40 karakter olmalı.");

if(!code.trim())
return err("Kod boş olamaz.");

if(code.length>900000)
return err("Kod çok uzun.");

if(!(await needLogin())) return;

const owner=myName||user.displayName||"Anonim";

$("eSave").disabled=true;

err("");

try{

const b=writeBatch(db);

if(!editing){

b.set(doc(db,"sites",key),{

name,
category,
code,
owner:user.uid,
ownerName:owner,
createdAt:serverTimestamp()

});

}else if(editing.key===key){

b.update(doc(db,"sites",key),{

name,
category,
code

});

}else{

const existing=await getDoc(doc(db,"sites",key));

if(existing.exists()&&existing.data().owner!==user.uid){

err("Bu site adı zaten alınmış.");

$("eSave").disabled=false;

return;

}

b.set(doc(db,"sites",key),{

name,
category,
code,
owner:user.uid,
ownerName:owner,
createdAt:editing.createdAt||serverTimestamp()

});

b.delete(doc(db,"sites",editing.key));

}

await b.commit();

const wasMine=$("mMine").classList.contains("open");

closeModal("mEdit");

editing=null;

await load();

if(wasMine){

drawMine();

openModal("mMine");

}

}catch(e){

err(/permission|exist|already/i.test(e.message)
?"Bu site adı kullanılamıyor. Başka bir ad dene."
:e.message);

}

$("eSave").disabled=false;

};


/* SİTE SİL */

$("eDel").onclick=async()=>{

if(!editing||!confirm("Bu site kalıcı olarak silinsin mi?"))
return;

try{

await writeBatch(db)
.delete(doc(db,"sites",editing.key))
.commit();

}catch(e){

return alert(e.message);

}

closeModal("mEdit");

editing=null;

await load();

drawMine();

openModal("mMine");

};


/* SİTELERİM */

function drawMine(){

const mine=all.filter(s=>user&&s.owner===user.uid);

$("mineList").innerHTML=mine.length
?mine.map(s=>`

<div class="mine">

<div>
<div class="n">${esc(s.name)}</div>
<div class="l">${esc(linkOf(s.key))}</div>
</div>

<div style="display:flex;gap:6px">

<button class="btn" data-o="${esc(s.key)}">Aç</button>

<button class="btn" data-s="${esc(s.key)}">Ayarlar</button>

</div>

</div>

`).join("")
:`<div class="empty">Henüz sitenin yok.</div>`;

$("mineList").querySelectorAll("[data-o]").forEach(b=>{

b.onclick=()=>{
closeModal("mMine");
location.hash=b.dataset.o;
};

});

$("mineList").querySelectorAll("[data-s]").forEach(b=>{

b.onclick=()=>{

const s=all.find(x=>x.key===b.dataset.s);

$("mMine").classList.remove("open");

openEdit(s);

showX(()=>{

closeModal("mEdit");

editing=null;

drawMine();

openModal("mMine");

});

};

});

}

$("btnMine").onclick=async()=>{

if(await needLogin()){

await load();

drawMine();

openModal("mMine");

}

};


/* TAM EKRAN SİTE GÖRÜNTÜLEYİCİ */

async function openSite(key){

key=decodeURIComponent(key);

let s=all.find(x=>x.key===key);

if(!s){

const d=await getDoc(doc(db,"sites",key)).catch(()=>null);

if(d&&d.exists())
s={key:d.id,...d.data()};

}

if(!s){

alert("Site bulunamadı.");

history.replaceState(null,"",location.pathname);

return;

}

$("frame").srcdoc=s.code;

$("viewer").classList.add("open");

$("viewer").dataset.k=key;

showX(()=>{

history.pushState(null,"",location.pathname);

closeSite();

});

}

function closeSite(){

$("viewer").classList.remove("open");

$("frame").srcdoc="";

hideX();

}

$("vreport").onclick=async()=>{

const reason=prompt("Bu siteyi neden bildiriyorsun?");

if(!reason) return;

try{

await addDoc(collection(db,"reports"),{

site:$("viewer").dataset.k,
reason:reason.slice(0,500),
createdAt:serverTimestamp()

});

alert("Bildirimin alındı.");

}catch(e){

alert(e.message);

}

};

function route(){

const h=location.hash.slice(1);

h?openSite(h):closeSite();

}

window.addEventListener("hashchange",route);

load().then(route);

</script>
</body>
